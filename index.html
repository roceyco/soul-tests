const types=[
{cn:'午夜图书馆的守夜人',en:'The Midnight Librarian',keys:'暗调 · 文学 · 古典 · 神秘',desc:'你的审美像一座只在夜里开放的私人藏馆。你会被深色木头、旧纸张、磨损的皮革和留下时间痕迹的建筑吸引。比起崭新完美，你更相信物件经过使用之后才真正开始拥有灵魂。',life:'理想的一天从雨声和一盏台灯开始：慢慢读书、写下突然想起的句子，夜深后再去街上散步。你需要有边界的独处，也珍惜能聊到很晚的知己。',color:['#28392f','#80674c','#d1b989'],cncolor:['藏书绿','烟熏棕','羊皮纸'],animal:'黑猫',celebs:'蒂尔达·斯文顿｜帕蒂·史密斯｜坂本龙一',like:'古典唱片、手写笔记、旧电影院、黄铜器物',line:'你不是怀旧，只是愿意听见时间留下的回声。'},
{cn:'地中海的逃跑计划',en:'The Mediterranean Escapist',keys:'阳光 · 松弛 · 自然 · 漫游',desc:'你追求的是一种轻盈而真实的丰盛：让风穿过房间，让餐桌多留一把椅子，让计划可以临时改变。你喜欢自然材质与阳光的变化，胜过精心摆拍的完美。',life:'醒来不设闹钟，买些新鲜食材，沿着陌生街道走到天色变暖。你的理想生活有自由流动的时间，也有可以随时回去的温暖据点。',color:['#d1bb92','#6f9099','#eae2cf'],cncolor:['沙丘米','海雾蓝','贝壳白'],animal:'海龟',celebs:'碧姬·芭铎｜佩内洛普·克鲁兹｜卢卡·瓜达尼诺',like:'慢午餐、亚麻织物、露天市集、无目的散步',line:'自由不一定要远行，也可以是把今天还给自己。'},
{cn:'巴黎旧书店里的猫',en:'The Bookshop Cat',keys:'知性 · 经典 · 克制 · 温柔',desc:'你擅长在寻常之中辨认质感。一个舒服的剪裁、一张被翻旧的书页、一家熟悉的小店，都比追逐醒目的标志更能打动你。你的优雅不需要被宣布。',life:'你喜欢留一段空白给散步、阅读和偶遇。熟悉的街区让你安心，偶尔走进陌生展览又能给生活换一口气。你会用很少但用心的物件，搭起一个耐看的日常。',color:['#ddd1b9','#76685a','#9aa08e'],cncolor:['燕麦奶','烟草棕','鼠尾草'],animal:'橘猫',celebs:'简·伯金｜阿涅斯·瓦尔达｜保罗·纽曼',like:'二手书、黑咖啡、旧唱片、步行探索',line:'真正的风格，是不必解释为什么喜欢。'},
{cn:'偷走下午茶的花园狐狸',en:'The Garden Fox',keys:'俏皮 · 有机 · 奇想 · 生机',desc:'你给生活保留了一扇秘密的小门。植物、旧器皿和偶然发现的古怪东西，会在你手里组成一场轻巧的冒险。你既喜欢自然的野生，也喜欢带一点幽默的精心安排。',life:'你想要一张可以随时铺开野餐布的草地，也想要一群愿意临时改计划的朋友。日常的小插曲不是麻烦，而是故事真正开始的地方。',color:['#536448','#c98a62','#ead9ad'],cncolor:['苔藓绿','杏子茶','野蜂蜜'],animal:'红狐狸',celebs:'碧翠丝·波特｜弗洛伦丝·韦尔奇｜韦斯·安德森',like:'野餐、植物交换、手绘地图、复古茶具',line:'生活的暗门很多，你总能找到一扇通往惊喜的。'},
{cn:'禅意陶艺师',en:'The Quiet Potter',keys:'手作 · 留白 · 质朴 · 宁静',desc:'你看重触感、过程和真实的材料。粗陶的微小凹凸、木头的纹理、布料的不规则折痕，会让你觉得安心。你不急着填满空间，也不急着给每件事下结论。',life:'理想的一天有一段不被打断的专注时间。做饭、修补、整理桌面或捏一只陶杯，都能让思绪慢慢沉淀。对你而言，安静不是空白，而是感受重新变清晰。',color:['#a66f50','#d5c7aa','#737b66'],cncolor:['陶土','原麻','叶影'],animal:'白鹭',celebs:'野口勇｜滨口龙介｜Agnes Martin',like:'陶器、手工书、茶、慢火料理',line:'你让双手慢下来，心就知道该往哪里去。'},

{cn:'玫瑰园里的小公爵夫人',en:'The Rose Garden Duchess',keys:'浪漫 · 细腻 · 优雅 · 仪式感',desc:'你有能力把细节变成心意。花束、餐巾、香气和一句认真写下的话，在你这里不是装饰，而是让人感到被珍惜的语言。你相信温柔也可以很有力量。',life:'你愿意为重要的人准备一顿饭，也愿意为自己点上蜡烛。理想生活不必奢华，但要有值得记住的小仪式，和可以放心柔软的关系。',color:['#c67b87','#e9d8cc','#aa875e'],cncolor:['玫瑰雾','香槟奶油','古典木'],animal:'天鹅',celebs:'奥黛丽·赫本｜索菲亚·科波拉｜维多利亚·贝克汉姆',like:'鲜花、香氛、精致茶点、旧电影',line:'浪漫不是等待被安排，而是认真对待每一个平常日子。'},
{cn:'未来世界的建筑师',en:'The Future Architect',keys:'先锋 · 几何 · 清醒 · 实验',desc:'你会先看见事物的结构，再想象它还能变成什么。清晰的线条、新材料和大胆空间让你兴奋；你喜欢能打开新可能性的设计，而不是重复熟悉答案。',life:'你需要一张宽敞的工作台和不断更新的灵感输入。未来感对你不是冷冰冰的外观，而是一种愿意重新设计规则、让生活更有效也更自由的态度。',color:['#aebbc1','#59616a','#d9d8ce'],cncolor:['雾银','石墨灰','月光白'],animal:'猎隼',celebs:'扎哈·哈迪德｜隈研吾｜Bjork',like:'建筑模型、电子音乐、设计档案、科幻电影',line:'你不等未来发生，你已经在为它画第一张图。'},
{cn:'天鹅绒收藏家',en:'The Velvet Collector',keys:'丰饶 · 历史 · 华丽 · 戏剧',desc:'你喜欢美拥有重量和回响。深色、金属、丝绒与古老工艺，让你感到世界并非只有效率；它也可以郑重、丰盛，值得慢慢欣赏。',life:'你理想中的夜晚有柔和灯光、认真挑选的音乐和几件能开启话题的珍藏。你愿意为经得起时间的品质付出，也懂得享受属于自己的隆重时刻。',color:['#702f3d','#b18b4e','#3c2c30'],cncolor:['勃艮第','古董金','黑樱桃'],animal:'黑豹',celebs:'李·拉兹维尔｜卡尔·拉格斐｜海伦·米伦',like:'古董珠宝、歌剧、香水、历史酒店',line:'隆重不是为了被看见，而是提醒自己值得被认真对待。'},
{cn:'霓虹都市游牧者',en:'The Neon Nomad',keys:'都市 · 鲜明 · 流动 · 先锋',desc:'你在变化中获得能量。夜间城市的灯光、街头招贴和不同文化彼此碰撞的声音，能让你快速进入灵感状态。你不是坐等灵感的人，移动本身就是你的方法。',life:'你喜欢行程留有弹性，认识新朋友，也保留突然转身去看一场演出的自由。熟悉的地方会变得无聊，但城市每天都能给你新路线。',color:['#bb3477','#46519b','#dfb344'],cncolor:['霓虹莓','夜幕蓝','信号黄'],animal:'乌鸦',celebs:'川久保玲｜FKA twigs｜宫崎英高',like:'夜行摄影、现场演出、球鞋文化、独立电台',line:'你把未知当成方向，所以总能先一步遇见新鲜事。'},
{cn:'野花田里的造梦者',en:'The Wildflower Dreamer',keys:'自由 · 轻盈 · 梦幻 · 自然',desc:'你对世界保有柔软的好奇。自然不是背景，而是一种提醒：许多美好的事并不整齐，也不需要被控制。你愿意跟着直觉走一段，再看看会遇见什么。',life:'独处写字、在户外发呆、临时决定去看日落，都能让你恢复活力。你需要关系里的理解，也需要不被催促着成为某种固定样子。',color:['#bdc8ad','#d6b6b0','#e1d8bc'],cncolor:['桉叶雾','花瓣粉','麦田浅金'],animal:'蝴蝶',celebs:'弗里达·卡罗｜弗洛伦丝·韦尔奇｜宫崎骏',like:'野花、日记、露天电影、自然观察',line:'地图之外仍有路，你的想象力知道如何抵达。'},

const questions=[['感知','走进陌生空间，你最先被什么吸引？',['旧书店里有批注的书页和木梯','一面空墙上缓慢移动的日光','桌上来自异地、看不出用途的小物','房间里正在发生的交谈与笑声']],['日常','突然空出一个下午，你更想做什么？',['去巴黎街区散步，看橱窗和街景','在家修理或制作一件实用的东西','坐公交到终点，再随机探索附近','约朋友去一场吵闹的现场演出']],['风格','哪种穿衣选择最能表达你的审美？',['深色皮衣和磨旧的靴子','线条极简、几乎没有装饰的套装','鲜艳图案混搭，远远就能认出你','柔软轻盈的衣料，随动作自然摆动']],['艺术','哪件作品最让你驻足？',['密集繁复、像梦境一样的巨幅绘画','粗粝陶器，保留裂纹和指印','随观众移动改变的光影装置','安静细致的植物写生']],['色彩','你会把哪组颜色带进日常？',['酒红、墨绿与暗金','粉雾、奶油白与浅杏','银灰、黑与冷白','赭土、苔绿与焦糖']],['自然','哪种户外景象让你停留？',['雨后森林的湿润苔藓','海边悬崖与强风，远处没有建筑','城市缝隙里长出的野花','荒凉岩地上的异星植物']],['城市','你会走进哪种城市空间？',['午夜亮灯的老电影院','巴黎旧街区临街咖啡馆','几何结构清晰的新建筑','地下演出场地涌出的音乐']],['珍藏','只能留一件纪念物？',['祖辈留下、边角磨损的首饰盒','自己做的歪斜陶杯','写着心情的演出票根','纹理奇特的旅行石头']],['相聚','哪种聚会最令你满足？',['听朋友讲家族往事','略带戏剧性的盛装晚宴','一起做饭，菜式临时拼凑','看电影后散步聊镜头']],['光线','哪种光线最能改变空间？',['烛火在深色木墙上摇曳','工作室清晰均匀的白光','霓虹映在雨后街道','黄昏暖光穿过窗帘']],['植物','你愿意照料哪种植物？',['颜色浓烈的异国花','耐旱、几周不管也能活的绿植','随手采的小花插进旧玻璃瓶','简洁的枝条和干草穗']],['想象','住进一个虚构世界一年？',['藏古地图手稿的私人档案馆','随潮汐慢下来的海岛小屋','每天有新展览的艺术公寓','窗外是精密灯网的未来城市']]];;

let at=0,answers=[];function begin(){at=0;answers=[];show('quiz');draw()}function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));scrollTo(0,0)}function draw(){let q=questions[at];document.getElementById('num').textContent=String(at+1).padStart(2,'0')+' / 12';document.getElementById('progress').style.width=(at+1)/12*100+'%';document.getElementById('cat').textContent='第 '+String(at+1).padStart(2,'0')+' 题 · '+q[0];document.getElementById('title').textContent=q[1];document.getElementById('prev').disabled=at===0;document.getElementById('next').textContent=at===11?'揭晓我的结果 →':'下一题 →';document.getElementById('hint').textContent=answers[at]===undefined?'': '已保存';document.getElementById('choices').innerHTML=q[2].map((v,i)=>`<button class="choice ${answers[at]===i?'on':''}" onclick="pick(${i})"><b>0${i+1}</b><span>${v}</span></button>`).join('')+`<button class="choice skip ${answers[at]===4?'on':''}" onclick="pick(4)"><b>↷</b><span>都不想选 / 说不清 — 跳过此题，不影响结果</span></button>`+`<button class="choice skip ${answers[at]===4?'on':''}" onclick="pick(4)"><b>↷</b><span>都不想选 / 说不清　<span style="color:#777568">跳过此题，不影响结果</span></span></button>`}function pick(i){answers[at]=i;draw()}function step(d){if(d>0&&answers[at]===undefined){toast('先凭直觉选一项吧');return}at+=d;if(at<0)at=0;if(at===12){finish();return}draw();scrollTo({top:0,behavior:'smooth'})}function finish(){let score=Array(12).fill(0);answers.forEach((a,i)=>{if(a!==4)score[answerMap[i][a]]++});let order=score.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]),n=order[0][1],second=order.find(x=>x[1]!==n)[1];result(n,second,score)}function result(n,second,score){let t=types[n];document.getElementById('rname').textContent=t.cn;document.getElementById('ren').textContent=t.en;document.getElementById('rkeywords').textContent=t.keys;document.getElementById('quote').textContent='“'+t.line+'”';let pct=[8,11,7,9,8,7,9,6,7,10,9,9][n],dims=['空间感','色彩偏好','生活节奏','收藏直觉','社交氛围','自然亲和'],vals=dims.map((_,i)=>Math.min(96,42+(n*11+i*19)%47));document.getElementById('cards').innerHTML=`<article class="card wide"><h2>你的审美人格 · 深度解析</h2><p>${t.desc}</p><p>${t.life}</p><p>你容易被${t.keys.split(' · ').join('、')}打动，也习惯通过环境与细节表达自己。你的审美不是一套需要遵守的规则，而是一次次选择累积出的生活语言。你可以借由${t.like}为日常补充能量，同时保留探索相反风格的空间；真正适合你的东西，往往是让你愿意反复回看的那一个。</p></article><article class="card"><h2>最适合你的颜色</h2><p>这组色彩能映照你的气质，也适合成为穿搭、空间或日常小物的灵感起点。</p><div class="colors">${t.color.map((c,i)=>`<div class="color"><i style="background:${c}"></i>${t.cncolor[i]}<br>${c.toUpperCase()}</div>`).join('')}</div></article><article class="card"><h2>灵魂动物与关键词</h2><p>灵魂动物：<b>${t.animal}</b></p><div class="pills" style="margin-top:16px">${t.keys.split(' · ').map(k=>`<span class="pill">${k}</span>`).join('')}</div><p style="margin-top:17px">可能会喜欢：${t.like}。</p></article><article class="card"><h2>同类名人</h2><p style="font-size:19px;color:#59624a">${t.celebs}</p><p style="margin-top:10px">相似的是他们公开呈现的审美线索与创作气质，并非人生经历完全相同。</p></article><article class="card"><h2>你的同频坐标</h2><div style="font:42px Georgia;color:#59624a;margin:8px 0">${pct}%</div><p>的人与你拥有相近的审美频率。你最相邻的第二气质是：${types[second].cn}。细微的交叠让你的风格更有个人层次。</p></article><article class="card"><h2>审美雷达</h2><p>不同维度共同构成你的审美坐标。</p><div class="radar">${dims.map((d,i)=>`<div><i style="height:${vals[i]}%"></i><span>${d}</span></div>`).join('')}</div></article><article class="card wide"><h2>你理想中的生活片段</h2><p>${t.life}</p></article>`;window.resultType=n;show('result')}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),1500)}async function share(){let t=types[window.resultType],text=`我的审美灵魂是「${t.cn}」——${t.line} 你也来测测！`;try{if(navigator.share)await navigator.share({title:'审美灵魂图鉴',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);toast('分享文案已复制')}}catch(e){}}function downloadPoster(){let t=types[window.resultType],c=document.createElement('canvas');c.width=1080;c.height=1920;let x=c.getContext('2d');x.fillStyle='#eee9df';x.fillRect(0,0,1080,1920);x.fillStyle='#59624a';x.font='26px sans-serif';x.fillText('A E S T H E T I C   S O U L   A T L A S',90,115);x.fillRect(90,160,900,2);x.fillStyle='#777568';x.font='32px sans-serif';x.fillText('你的审美灵魂是',90,270);x.fillStyle='#282921';x.font='bold 62px serif';wrap(t.cn,90,390,880,78);x.fillStyle='#777568';x.font='28px Georgia';x.fillText(t.en,90,610);x.fillStyle=t.color[0];x.fillRect(90,710,900,470);x.fillStyle='#fff';x.font='italic 42px serif';wrap('“'+t.line+'”',140,910,800,62);x.fillStyle='#282921';x.font='30px sans-serif';x.fillText('审美关键词',90,1290);x.font='27px sans-serif';x.fillText(t.keys,90,1350);x.fillText('同类名人  '+t.celebs,90,1430);x.fillStyle='#777568';x.font='23px sans-serif';x.fillText('AESTHETIC SOUL TEST · 你的偏爱就是坐标',90,1770);let a=document.createElement('a');a.download='审美灵魂结果海报.png';a.href=c.toDataURL('image/png');a.click()}function wrap(s,x,y,max,lh){let line='';for(const ch of s){if(x.measureText(line+ch).width>max){x.fillText(line,x,y);line='';y+=lh}line+=ch}x.fillText(line,x,y)}
